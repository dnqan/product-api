name: Product API CD Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Start Product API
        run: |
          MONGO_URI=mongodb://localhost:27017/productdb PORT=3000 node app.js &
          sleep 5

      - name: Health check Product API
        run: |
          curl --fail http://localhost:3000/

      - name: Run CI test
        run: npm run test:ci

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ntthuyvy/product-api:latest

  deploy-local:
    needs: build-test-push

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest Docker image
        shell: cmd
        run: |
          docker compose -f docker-compose-prod.yaml pull

      - name: Deploy to Local Docker Engine
        shell: cmd
        run: |
          docker compose -f docker-compose-prod.yaml up -d

      - name: Check production containers
        shell: cmd
        run: |
          docker compose -f docker-compose-prod.yaml ps