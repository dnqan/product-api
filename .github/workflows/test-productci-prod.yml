name: Product API CI Prod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-prod:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://localhost:27017/productdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        run: |
          npm start &
          sleep 10

      - name: Test API health
        run: |
          curl --fail http://localhost:3000/

      - name: Test GET products
        run: |
          curl --fail http://localhost:3000/api/products

      - name: Test CREATE product
        run: |
          curl --fail -X POST http://localhost:3000/api/products \
          -H "Content-Type: application/json" \
          -d '{"pid":"CI001","pname":"CI Product","price":1000,"quantity":5}'

      - name: Test READ product
        run: |
          curl --fail http://localhost:3000/api/products/CI001

      - name: Test UPDATE product
        run: |
          curl --fail -X PUT http://localhost:3000/api/products/CI001 \
          -H "Content-Type: application/json" \
          -d '{"pname":"CI Product Updated","price":2000,"quantity":10}'

      - name: Test DELETE product
        run: |
          curl --fail -X DELETE http://localhost:3000/api/products/CI001