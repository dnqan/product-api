
name: Product API - Production CRUD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-crud:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    env:
      PORT: 3000
      MONGODB_URI: mongodb://127.0.0.1:27017/productdb_test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Product API
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:3000/; then
              echo "Product API is ready"
              exit 0
            fi
            sleep 2
          done
          cat server.log
          echo "Product API failed to start"
          exit 1

      - name: Test CREATE product
        run: |
          curl --fail --silent --show-error \
            -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"CI001","pname":"CI Test Product","price":100,"quantity":5}' \
            -o create.json
          cat create.json
          node -e "const p=require('./create.json'); if(p.pid!=='CI001') process.exit(1)"

      - name: Test READ products
        run: |
          curl --fail --silent --show-error \
            http://localhost:3000/api/products -o products.json
          node -e "const p=require('./products.json'); if(!Array.isArray(p)||!p.some(x=>x.pid==='CI001')) process.exit(1)"

      - name: Test READ product by pid
        run: |
          curl --fail --silent --show-error \
            http://localhost:3000/api/products/CI001 -o product.json
          node -e "const p=require('./product.json'); if(p.pid!=='CI001') process.exit(1)"

      - name: Test UPDATE product
        run: |
          curl --fail --silent --show-error \
            -X PUT http://localhost:3000/api/products/CI001 \
            -H "Content-Type: application/json" \
            -d '{"pname":"Updated CI Product","price":200,"quantity":10}' \
            -o update.json
          node -e "const p=require('./update.json'); if(p.pname!=='Updated CI Product'||p.price!==200||p.quantity!==10) process.exit(1)"

      
      - name: Test DELETE product
        run: |
          curl --fail --silent --show-error \
            -X DELETE http://localhost:3000/api/products/CI001 \
            -o delete.json
          node -e "const p=require('./delete.json'); if(p.message!=='Product deleted successfully') process.exit(1)"

      - name: Verify product deleted
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            http://localhost:3000/api/products/CI001)
          if [ "$status" -ne 404 ]; then
            echo "Expected HTTP 404 after deletion, received $status"
            exit 1
          fi
          echo "Product deletion verified"